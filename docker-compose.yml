services:
  app:
    build: .
    image: weight-tracker
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - SQL_DB_PATH=/data/weighttracker.db
      - FATSECRET_CONSUMER_KEY=${FATSECRET_CONSUMER_KEY:-}
      - FATSECRET_CONSUMER_SECRET=${FATSECRET_CONSUMER_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TZ=${TZ:-UTC}
